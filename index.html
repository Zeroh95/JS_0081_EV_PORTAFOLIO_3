<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/CSS/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./assets/JS/script.js"></script>
    <title>Lista de Tareas</title>
</head>
<body>
    <h1 id="titulo">Lista de Tareas</h1>
    <div class="container">
        <div class="card" id="agregarTarea">
            <form action="#" onsubmit="agregarProducto(event)">
                <div class="card-body">
                    <label for="tarea" class="card-title">Nombre Tarea</label>
                    <input type="text" name="tarea" id="tarea" placeholder="Ingrese el nombre de la tarea">
                </div>
                <div>
                    <button class="btn btn-success mb-3" type="submit">Agregar</button>
                </div>
            </form>
        </div>
    </div>
    <hr>
    <section class="row">
        <section>
            <h3>Productos Agregados</h3>
            <ul id="lista-productos-agregados">

            </ul>
        </section>
        <section>
            <h3>Productos Ya Comprados</h3>
            <ul id="lista-productos-comprados">

            </ul>
        </section>
    </section>
</body>
</html>
